# Dependabot for Hex and npm supply-chain updates (EEF Security WG guidance).
version: 2
updates:
  - package-ecosystem: mix
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: mix
    directory: "/mcp"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: mix
    directory: "/design"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: mix
    directory: "/installer"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: mix
    directory: "/e2e"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Zag.js ships every machine from one monorepo tag. Mixed versions install
      # two copies of @zag-js/core and break VanillaMachine typing, so bump them
      # in a single PR (also: pnpm run update:zag).
      zag-js:
        patterns:
          - "@zag-js/*"
        applies-to: version-updates
      zag-js-security:
        patterns:
          - "@zag-js/*"
        applies-to: security-updates
