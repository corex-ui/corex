packages:
  - e2e

allowBuilds:
  esbuild: false

# Keep transitive build/test tooling at or above the fixed versions for
# EEF-CVE-2026-97200 (esbuild), GHSA-587h-7wmj-h5pm (vite) and the
# postcss/nanoid/source-map-js/brace-expansion/minimatch advisories.
# vite 7.3.7 accepts esbuild ^0.27 || ^0.28, which keeps that override in range.
# minimatch 11 is a major over eslint's ^10.2.6 range; eslint does not use the
# APIs that changed and `pnpm run lint` passes, but revisit on the next eslint bump.
overrides:
  brace-expansion: ^5.0.12
  esbuild: ^0.28.2
  minimatch: ^11.0.5
  nanoid: ^3.3.20
  postcss: ^8.5.32
  source-map-js: ^1.2.2
  vite: ^7.3.7
